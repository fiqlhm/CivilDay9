<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIVIL DAY 9 - Updated Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #1A0B38;
            margin: 0;
            padding: 0;
        }
        /* Full-width glow divider between main sections */
        .glow-divider-full {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, rgba(247,210,74,1) 0%, rgba(179,138,227,1) 100%);
            box-shadow: 0 0 22px rgba(247,210,74,0.35), 0 0 44px rgba(179,138,227,0.18);
            margin: 0;
            display: block;
            pointer-events: none;
        }
        @media (min-width: 768px) {
            .glow-divider-full { height: 8px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Mengambil fungsi dari React Global (pengganti import)
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- DEFINISI ICON MANUAL ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Menu = (props) => <IconWrapper {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>;
        const ArrowRight = (props) => <IconWrapper {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
        const ChevronLeft = (props) => <IconWrapper {...props}><path d="m15 18-6-6 6-6"/></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><path d="m9 18 6-6-6-6"/></IconWrapper>;
        const Presentation = (props) => <IconWrapper {...props}><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></IconWrapper>;
        const FileText = (props) => <IconWrapper {...props}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></IconWrapper>;
        const ImageIcon = (props) => <IconWrapper {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></IconWrapper>;
        const UploadCloud = (props) => <IconWrapper {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></IconWrapper>;
        const Twitter = (props) => <IconWrapper {...props}><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-12.7 12.5S1.2 2.9 8.3 9c-4.2-.2-6.1-3-6.1-3 5.4 1 8.3-2 8.3-2-2.1-.8-2.6-4.6-2.6-4.6 1.9 1 3.5.7 3.5.7C10.7.3 15.8 4.7 15.8 4.7c1.3-.2 2.7-.8 2.7-.8 0 1.5-1.5 2.6-1.5 2.6C19.3 6.1 22 4 22 4z"/></IconWrapper>;
        const Instagram = (props) => <IconWrapper {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></IconWrapper>;
        const Linkedin = (props) => <IconWrapper {...props}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></IconWrapper>;
        const Youtube = (props) => <IconWrapper {...props}><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></IconWrapper>;

        // --- KOMPONEN-KOMPONEN WEBSITE ---

        // 1. Komponen Pita Berjalan (Background Text)
        const ScrollingTape = ({ text, colorClass, rotateClass, direction = 'normal', speed = '20s', top, left, right, bottom }) => {
            return (
                <div 
                className={`absolute flex overflow-hidden whitespace-nowrap py-3 font-bold tracking-widest uppercase z-0 ${colorClass} ${rotateClass} shadow-[0_0_15px_rgba(247,210,74,0.5)]`}
                style={{ 
                    width: '150%', 
                    top, left, right, bottom,
                    transformOrigin: 'center center',
                }}
                >
                <div className={`animate-marquee flex space-x-8 ${direction === 'reverse' ? 'animate-marquee-reverse' : ''}`} style={{ animationDuration: speed }}>
                    {[...Array(20)].map((_, i) => (
                    <span key={i} className="mx-4 text-sm md:text-base drop-shadow-[0_1px_2px_rgba(0,0,0,0.3)]">{text}</span>
                    ))}
                </div>
                </div>
            );
        };

        // 2. Komponen Kartu Statistik (Angka-angka)
        const StatCard = ({ number, label, borderColor }) => (
            <div className={`group relative bg-[#3A1C7F]/80 backdrop-blur-sm rounded-xl p-8 text-center border-b-4 transition-transform hover:-translate-y-2 duration-300 ${borderColor} shadow-[0_10px_30px_-10px_rgba(90,59,170,0.5)] hover:shadow-[0_20px_40px_-10px_rgba(247,210,74,0.5)]`}>
                <div className="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity rounded-xl pointer-events-none"></div>
                <h3 className={`text-4xl md:text-5xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r ${borderColor === 'border-[#F7D24A]' ? 'from-[#F7D24A] to-[#FADF7C]' : 'from-[#F3A6D7] to-[#B38AE3]'}`}>
                {number}
                </h3>
                <p className="text-[#FFF8E6] font-semibold text-lg">{label}</p>
            </div>
        );

        // 3. Komponen Kartu Lomba Utama
        const CompetitionCard = ({ title, icon: Icon, active = false, link = '#' }) => (
            <div className={`w-full max-w-md relative flex flex-col items-center p-8 rounded-2xl transition-all duration-500 ${active ? 'bg-gradient-to-br from-[#5A3BAA] to-[#3A1C7F] text-white shadow-[0_0_30px_rgba(247,210,74,0.4)] z-10 border-2 border-[#F7D24A]' : 'bg-[#2D1466]/80 backdrop-blur-sm text-[#FFF8E6] shadow-[0_10px_20px_rgba(0,0,0,0.2)] hover:shadow-[0_15px_30px_rgba(90,59,170,0.4)] border-2 border-[#6C63FF]/30'}`}>
                <div className={`p-6 rounded-full mb-6 ${active ? 'bg-[#F7D24A]/20 shadow-[0_0_15px_rgba(247,210,74,0.4)]' : 'bg-[#6C63FF]/10'}`}>
                <Icon size={64} className={active ? 'text-[#F7D24A]' : 'text-[#B38AE3]'} />
                </div>
                <h3 className="text-3xl font-bold mb-4 text-center">{title}</h3>
                <p className={`text-center text-base mb-8 leading-relaxed ${active ? 'text-[#FADF7C]' : 'text-[#FFF8E6]/70'}`}>
                Sambil menikmati proses belajar, mari asah keterampilan teknismu melalui tantangan yang seru dan kompetitif tahun ini dan segera daftarkan tim hebatmu melalui formulir di bawah ini.
                </p>
                <button 
                    onClick={() => window.open(link, '_blank')}
                    className={`w-full px-8 py-4 rounded-xl font-bold text-lg transition-all ${active ? 'bg-[#F7D24A] text-[#5A3BAA] hover:bg-[#FADF7C] hover:shadow-[0_0_20px_rgba(247,210,74,0.8)]' : 'bg-[#6C63FF]/20 text-[#B38AE3] hover:bg-[#6C63FF]/40 hover:text-white'}`}
                >
                Register Now
                </button>
            </div>
        );

        // 4. Komponen Tombol Samping (TOR, Twibbon, PPT)
        const ActionButton = ({ icon: Icon, label, link = '#' }) => (
            <button 
                onClick={() => window.open(link, '_blank')}
                className="group flex items-center justify-between w-full p-5 rounded-xl bg-[#2D1466]/80 border-2 border-[#6C63FF]/30 hover:border-[#F7D24A] hover:bg-[#3A1C7F] transition-all duration-300 text-left shadow-[0_4px_15px_rgba(0,0,0,0.2)] hover:shadow-[0_0_20px_rgba(247,210,74,0.3)]"
            >
                <div className="flex items-center gap-5">
                    <div className="p-3 rounded-lg bg-[#6C63FF]/20 group-hover:bg-[#F7D24A] group-hover:text-[#1A0B38] transition-colors duration-300 text-[#B38AE3]">
                        <Icon size={28} />
                    </div>
                    <div>
                        <span className="block text-xl font-bold text-[#FFF8E6] group-hover:text-[#F7D24A] transition-colors">{label}</span>
                        <span className="text-xs text-[#FFF8E6]/50 group-hover:text-[#FFF8E6]/80 uppercase tracking-wider">Click to access</span>
                    </div>
                </div>
                <ArrowRight className="text-[#6C63FF] group-hover:text-[#F7D24A] transform group-hover:translate-x-2 transition-all duration-300" size={24} />
            </button>
        );

        // --- APLIKASI UTAMA ---
        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [currentSlide, setCurrentSlide] = useState(0);

            const slides = [
                "https://i.imgur.com/haShF1N.jpeg", 
                "https://i.imgur.com/PbTvG56.jpeg", 
                "https://i.imgur.com/mm9PYfo.png", 
                "https://i.imgur.com/siUXq0Z.png"  
            ];

            const nextSlide = () => {
                setCurrentSlide((prev) => (prev + 1) % slides.length);
            };

            const prevSlide = () => {
                setCurrentSlide((prev) => (prev - 1 + slides.length) % slides.length);
            };

            useEffect(() => {
                const interval = setInterval(nextSlide, 5000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleRegistrationClick = () => {
                window.open('https://forms.gle/hppVheZ4fYEx9jak8', '_blank');
            };
            const handleLearnMoreClick = () => {
                window.open('https://www.instagram.com/civilday_hmsitk/', '_blank');
            };
            const handleWatchVideoClick = () => {
                window.open('https://www.instagram.com/reel/DRUhbMBE-Em/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==', '_blank');
            };

            return (
                <div className="font-sans text-[#FFF8E6] bg-[#1A0B38] overflow-x-hidden w-full">
                <style>{`
                    @keyframes marquee {
                    0% { transform: translateX(0); }
                    100% { transform: translateX(-50%); }
                    }
                    .animate-marquee {
                    animation: marquee linear infinite;
                    display: flex;
                    min-width: 200%;
                    }
                    .animate-marquee-reverse {
                    animation-direction: reverse;
                    }
                    ::-webkit-scrollbar { width: 10px; }
                    ::-webkit-scrollbar-track { background: #1A0B38; }
                    ::-webkit-scrollbar-thumb { background: #5A3BAA; border-radius: 5px; }
                    ::-webkit-scrollbar-thumb:hover { background: #6C63FF; }
                    ::selection { background: #F7D24A; color: #1A0B38; }
                `}</style>

                {/* Navbar */}
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-[#1A0B38]/95 backdrop-blur-md py-4 shadow-[0_4px_30px_rgba(0,0,0,0.5)] border-b border-[#6C63FF]/20' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="w-10 h-10 flex items-center justify-center font-bold text-xl text-[#1A0B38]">
                        <img src="https://i.imgur.com/BzsigYm.png"/>
                        </div>
                        <span className="font-bold text-xl tracking-wider text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]"></span>
                    </div>

                    <div className={`hidden md:flex items-center space-x-8 font-medium text-[#B38AE3]`}>
                        <a href="#" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Home</a>
                        <a href="#about" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">About</a>
                        <a href="#competition" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Competition</a>
                        <a href="#event" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Event</a>
                        <button 
                            onClick={handleRegistrationClick}
                            className="bg-gradient-to-r from-[#F7D24A] to-[#FADF7C] text-[#1A0B38] px-6 py-2 rounded-full font-bold hover:shadow-[0_0_20px_rgba(247,210,74,0.7)] transition-all transform hover:scale-105"
                        >
                        Registration Open
                        </button>
                    </div>

                    <button className="md:hidden text-[#B38AE3] hover:text-[#F7D24A] transition-colors" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                    </button>
                    </div>

                    {isMenuOpen && (
                    <div className="md:hidden bg-[#2D1466]/95 backdrop-blur-md absolute top-full left-0 w-full shadow-xl border-t border-[#6C63FF]/30">
                        <div className="flex flex-col p-6 space-y-4 font-semibold text-[#B38AE3]">
                        <a href="#" className="hover:text-[#F7D24A] transition-colors">Home</a>
                        <a href="#about" className="hover:text-[#F7D24A] transition-colors">About</a>
                        <a href="#competition" className="hover:text-[#F7D24A] transition-colors">Competition</a>
                        <a href="#event" className="hover:text-[#F7D24A] transition-colors">Event</a>
                        <button 
                            onClick={handleRegistrationClick}
                            className="bg-[#F7D24A]/20 text-[#F7D24A] w-full py-3 rounded-lg text-sm border border-[#F7D24A]/30"
                        >
                            Registration Open
                        </button>
                        </div>
                    </div>
                    )}
                </nav>

                {/* Hero Section */}
                <header className="relative min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-b from-[#1A0B38] via-[#2D1466] to-[#1A0B38] pt-20">
                    <ScrollingTape text="SMART STRUCTURE • SMARTER FUTURE • CD9 2026 •" colorClass="bg-gradient-to-r from-[#5A3BAA] to-[#3A1C7F] text-[#FADF7C]" rotateClass="rotate-12" top="50%" left="-10%" speed="25s" />
                    <ScrollingTape text="INNOVATION • CREATIVITY • SUSTAINABILITY •" colorClass="bg-gradient-to-r from-[#F3A6D7] to-[#B38AE3] text-[#1A0B38]" rotateClass="-rotate-12" bottom="10%" right="-10%" direction="reverse" speed="30s" />
                    <ScrollingTape text="DIGITAL TRANSFORMATION • FORGING THE NEXT ERA •" colorClass="bg-gradient-to-r from-[#F7D24A] to-[#FADF7C] text-[#1A0B38]" rotateClass="rotate-45" top="20%" right="-40%" speed="20s" />
                    
                    <div className="absolute inset-0 opacity-20 pointer-events-none">
                        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6C63FF" strokeWidth="0.5"/>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid)" />
                            <circle cx="20%" cy="30%" r="200" stroke="#F3A6D7" strokeWidth="1" fill="none" opacity="0.3" />
                            <circle cx="80%" cy="70%" r="300" stroke="#6C63FF" strokeWidth="1" fill="none" opacity="0.3" />
                            <rect x="60%" y="20%" width="150" height="150" stroke="#F9EAA3" strokeWidth="1" fill="none" transform="rotate(45 60% 20%)" opacity="0.3"/>
                        </svg>
                    </div>

                    <div className="container mx-auto px-6 relative z-10 grid md:grid-cols-2 gap-12 items-center">
                    <div className="max-w-2xl relative">
                        <div className="absolute -top-20 -left-20 w-64 h-64 bg-[#F9EAA3] rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
                        <h1 className="text-2xl md:text-5xl font-extrabold text-white leading-tight mb-6 drop-shadow-[0_2px_10px_rgba(0,0,0,0.5)]">
                        Introducing, <br/>
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#F7D24A] via-[#FADF7C] to-[#F3A6D7] drop-shadow-[0_0_15px_rgba(247,210,74,0.8)]">Civil day 9</span>
                        <br/> HMS-ITK.
                        </h1>
                        
                        {/* UPDATE: Tombol lebih kecil di mobile (px-5 py-2.5 text-sm) dan besar di desktop (md:px-8 md:py-4) */}
                        <div className="flex flex-wrap gap-3 md:gap-4">
                            <button onClick={handleLearnMoreClick} className="bg-gradient-to-r from-[#F7D24A] to-[#FADF7C] text-[#1A0B38] px-5 py-2.5 md:px-8 md:py-4 text-sm md:text-base rounded-full font-bold shadow-[0_0_25px_rgba(247,210,74,0.5)] hover:shadow-[0_0_40px_rgba(247,210,74,0.8)] hover:scale-105 transition-all flex items-center gap-2">
                                Our Instagram <ArrowRight size={20} className="w-4 h-4 md:w-5 md:h-5"/>
                            </button>
                            <button onClick={handleWatchVideoClick} className="text-[#F7D24A] px-5 py-2.5 md:px-8 md:py-4 text-sm md:text-base rounded-full font-bold hover:bg-[#F7D24A]/10 border-2 border-[#F7D24A]/50 hover:border-[#F7D24A] transition-all">
                                Watch Trailer
                            </button>
                        </div>
                        {/* END UPDATE */}

                        <p className="mt-6 text-sm text-[#FADF7C] font-semibold drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Current Event: Registration (OPEN)</p>
                    </div>
                    <div className="hidden md:block relative">
                        <div className="absolute top-0 right-0 w-48 h-48 bg-[#F3A6D7] rounded-full mix-blend-screen filter blur-2xl opacity-30 animate-bounce" style={{animationDuration: '10s'}}></div>
                    </div>
                    </div>
                </header>
                <div className="glow-divider-full" />

                {/* About Section */}
                <section id="about" className="py-24 bg-[#1A0B38] relative">
                    <div className="absolute inset-0 opacity-10 pointer-events-none">
                        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <pattern id="grid-small" width="20" height="20" patternUnits="userSpaceOnUse">
                                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#6C63FF" strokeWidth="0.5"/>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid-small)" />
                        </svg>
                    </div>
                    <div className="container mx-auto px-6 max-w-4xl text-center relative z-10">
                    <h2 className="text-4xl md:text-5xl font-extrabold mb-8 text-white drop-shadow-[0_2px_5px_rgba(0,0,0,0.5)]">
                        What is <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#F7D24A] to-[#F3A6D7]">Civil Day 9?</span>
                    </h2>
                    <p className="text-[#B38AE3] text-lg leading-relaxed mb-16">
                        Merupakan ulang tahun Teknik Sipil ITK yang ke-9, berdiri sejak 1 April 2017 hingga sekarang.
                    </p>
                    <h2 className="text-4xl md:text-5xl font-extrabold mb-8 text-white drop-shadow-[0_2px_5px_rgba(0,0,0,0.5)]">
                        Dimensions United, <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#B38AE3] to-[#6C63FF]">Growth Beyond Limits</span>
                    </h2>
                    <p className="text-[#B38AE3] text-lg leading-relaxed">
                        Merepresentasikan kolaborasi berbagai elemen dalam Teknik Sipil yang bergerak bersama dalam satu visi lingkungan Teknik Sipil yang terbangun dari kolaborasi, kreativitas, dan kebersamaan. Melalui sinergi tersebut, diharapkan tercipta pertumbuhan yang berkelanjutan serta semangat untuk terus berkembang melampaui batasan yang ada.
                    </p>
                    </div>
                </section>
                <div className="glow-divider-full" />

                {/* Stats Section */}
                <section className="py-20 bg-gradient-to-b from-[#1A0B38] to-[#2D1466] relative">
                    <div className="absolute inset-0 opacity-30 pointer-events-none bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#5A3BAA]/30 via-transparent to-transparent"></div>
                    <div className="container mx-auto px-6 relative z-10">
                    <div className="grid grid-cols-1 md:flex-row items-center justify-center">
                        <StatCard number="10+" label="Total Participants" borderColor="border-[#F7D24A]" />
                    </div>
                    </div>
                </section>

                {/* Competition Section */}
                <section id="competition" className="py-24 bg-[#1A0B38] relative overflow-hidden">
                    <ScrollingTape text="COMPETE • INNOVATE • WIN •" colorClass="bg-gradient-to-r from-[#F7D24A] to-[#FADF7C] text-[#1A0B38]" rotateClass="-rotate-3" top="10%" speed="40s" />
                    <div className="container mx-auto px-6 relative z-10">
                    <div className="text-center mb-16">
                        <h2 className="text-4xl md:text-5xl font-extrabold text-white mb-4 drop-shadow-[0_2px_5px_rgba(0,0,0,0.5)]">Our <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#F7D24A] to-[#FADF7C]">Competition</span></h2>
                        <p className="text-[#B38AE3] max-w-2xl mx-auto">
                        Tunjukkan kemampuan terbaikmu dan jadilah juara di Civil Day 9.
                        </p>
                    </div>

                    <div className="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16 max-w-6xl mx-auto">
                        <div className="w-full md:w-1/2 flex justify-center md:justify-end">
                            <CompetitionCard title="Kompetisi Rancang Bangun Jembatan" icon={Presentation} active={true} link="https://forms.gle/hppVheZ4fYEx9jak8" />
                        </div>
                        <div className="w-full md:w-1/2 flex flex-col gap-5 max-w-md">
                            
                            <ActionButton 
                                icon={FileText} 
                                label="Terms Of Reference" 
                                link="https://drive.google.com/file/d/14k7uH9DsQ1RQrBbdIpwh1qfuExJedhvu/view?usp=sharing" 
                            />
                            <ActionButton 
                                icon={ImageIcon} 
                                label="Twibbon" 
                                link="https://supertwibbon.com/civilday-9" 
                            />
                            <ActionButton 
                                icon={UploadCloud} 
                                label="Upload PPT" 
                                link="https://forms.gle/pvmZ5Xucb3djaMVX6" 
                            />

                        </div>
                    </div>
                    </div>
                </section>
                <div className="glow-divider-full" />

                {/* Past Event Slider Section */}
                <section id="event" className="py-24 bg-gradient-to-t from-[#1A0B38] to-[#2D1466] relative">
                    <div className="container mx-auto px-6 text-center relative z-10">
                        <h2 className="text-4xl md:text-5xl font-extrabold text-white mb-8 drop-shadow-[0_2px_5px_rgba(0,0,0,0.5)]">Our <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#F3A6D7] to-[#B38AE3]">Past Event</span></h2>
                        <p className="text-[#B38AE3] mb-12 max-w-2xl mx-auto">
                        Dokumentasi dari kegiatan Civil day sebelumnya, yaitu Civil day-8
                        </p>
                        
                        <div className="relative w-full max-w-5xl mx-auto h-64 md:h-[500px] rounded-3xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] group border-2 border-[#6C63FF]/30">
                            {/* Area Gambar Slider */}
                            <div className="absolute inset-0 bg-[#1A0B38] flex items-center justify-center transition-all duration-700">
                                {slides.map((slide, index) => (
                                    <img 
                                        key={index}
                                        src={slide} 
                                        alt={`Event Slide ${index + 1}`} 
                                        className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out ${index === currentSlide ? 'opacity-50' : 'opacity-0'} mix-blend-luminosity`} 
                                    />
                                ))}
                                
                                <div className="absolute inset-0 bg-gradient-to-t from-[#1A0B38] via-[#2D1466]/60 to-transparent z-10"></div>
                                
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-6 z-20 pointer-events-none">
                                    <h3 className="text-3xl md:text-5xl font-bold mb-4 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)] tracking-wide">Civil Day 8</h3>
                                    <p className="text-[#FADF7C] font-medium text-lg md:text-xl drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)] bg-[#1A0B38]/40 px-6 py-2 rounded-full border border-[#FADF7C]/30 backdrop-blur-sm">
                                        Ulang Tahun Teknik Sipil ITK yang ke-8
                                    </p>
                                </div>
                            </div>

                            <button 
                                onClick={prevSlide}
                                className="absolute left-4 top-1/2 -translate-y-1/2 bg-[#5A3BAA]/30 hover:bg-[#F7D24A] text-white hover:text-[#1A0B38] p-4 rounded-full backdrop-blur-md transition-all z-30 opacity-0 group-hover:opacity-100 shadow-[0_0_15px_rgba(0,0,0,0.3)] hover:shadow-[0_0_25px_rgba(247,210,74,0.6)] border border-white/10"
                            >
                                <ChevronLeft size={32}/>
                            </button>
                            <button 
                                onClick={nextSlide}
                                className="absolute right-4 top-1/2 -translate-y-1/2 bg-[#5A3BAA]/30 hover:bg-[#F7D24A] text-white hover:text-[#1A0B38] p-4 rounded-full backdrop-blur-md transition-all z-30 opacity-0 group-hover:opacity-100 shadow-[0_0_15px_rgba(0,0,0,0.3)] hover:shadow-[0_0_25px_rgba(247,210,74,0.6)] border border-white/10"
                            >
                                <ChevronRight size={32}/>
                            </button>
                            
                            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex space-x-3 z-30">
                                {slides.map((_, index) => (
                                    <button 
                                        key={index} 
                                        onClick={() => setCurrentSlide(index)}
                                        className={`w-3 h-3 rounded-full transition-all duration-300 ${index === currentSlide ? 'bg-[#F7D24A] w-8 shadow-[0_0_10px_rgba(247,210,74,0.8)]' : 'bg-white/30 hover:bg-white/60'}`}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
                <div className="glow-divider-full" />

                {/* Footer */}
                <footer className="bg-[#0D041C] text-[#FFF8E6] py-12 border-t-4 border-[#6C63FF]/50 relative">
                    <div className="absolute inset-0 opacity-5 pointer-events-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgMEgyMFYyMEgyMFowIiBmaWxsPSIjNmM2M2ZmIiBmaWxsLW9wYWNpdHk9IjAuNCIvPjwvc3ZnPg==')]"></div>
                    <div className="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
                    <div className="flex flex-col md:flex-row gap-8 text-sm font-medium text-[#B38AE3]">
                        <a href="#" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Home</a>
                        <a href="#" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Map</a>
                        <a href="#" className="hover:text-[#F7D24A] transition-colors hover:drop-shadow-[0_0_5px_rgba(247,210,74,0.8)]">Registration</a>
                    </div>
                    
                    <div className="text-[#B38AE3]/60 text-xs text-center md:text-right">
                        <div className="flex justify-center md:justify-end gap-4 mb-4">
                            <a href="#" className="hover:text-[#F7D24A] transition-colors hover:scale-110"><Instagram size={20}/></a>
                            <a href="#" className="hover:text-[#F7D24A] transition-colors hover:scale-110"><Youtube size={20}/></a>
                        </div>
                        <p>© Taufiq 2026. All rights reserved.</p>
                        <p className="mt-1 text-[#FADF7C]/50">Build beyond limits.</p>
                    </div>
                    </div>
                </footer>
                </div>
            );
        };

        // --- RENDER KE LAYAR ---
        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);

    </script>
</body>
</html>
